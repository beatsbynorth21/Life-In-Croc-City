function feed(){const f=document.getElementById("feed");if(f)f.innerHTML=F.map(m=>m.sys?`<p style="margin:6px 0;padding:7px 10px;border-radius:9px;background:var(--ac);color:#fff;font-size:14px;font-weight:600">💸 ${esc(m.t)}</p>`:`<p style="margin:4px 0;font-size:14px;word-break:break-word"><b>${esc(m.n)}:</b> ${esc(m.t)}</p>`).join("")||`<p class="lb">No messages yet.</p>`}  
let TT;function toast(t,i){const e=document.getElementById("toast");e.textContent=(i||"💸")+" "+t;e.hidden=false;clearTimeout(TT);TT=setTimeout(()=>{e.hidden=true},4500)}  
function addF(n,t,sys){F.unshift({n:String(n).slice(0,20),t:String(t).slice(0,140),sys});F=F.slice(0,12);feed()}  
function say(e){e.preventDefault();const i=document.getElementById("ci"),t=i.value.trim().slice(0,140);if(!t)return;i.value="";if(R)R.emit("chat",{n:S.name,t}).catch(()=>addF(S.name,t));else addF(S.name,t)}

draw();  
function wireRoom(r){R=r;r.onPeers(()=>draw());  
 r.on("chat",m=>{const d=m.data||{};addF(d.n||"?",d.t||"")});  
 r.on("ev",m=>{const d=m.data||{};addE(d.n||"?",d.t||"")});
 r.on("dm",m=>{const d=m.data||{},id=me();if(id&&d.to==id.peer&&!m.isMe){const n=sn(d.n||"Someone")||"Someone";addDm(n,0,String(d.t||"").slice(0,200));toast(n+": "+String(d.t||"").slice(0,40),"\u{1F4AC}");if(!(PH&&TAB=="msg"&&MSGW==n))S.unread=(S.unread||0)+1}});  
 r.on("rob",m=>{const d=m.data||{},id=me();if(id&&d.to==id.peer&&S.go){const l=Math.min(S.cash,Math.max(0,Math.min(15000,Number(d.amt)||0)));S.cash-=l;S.log.unshift(esc(String(d.n||"Someone").slice(0,20))+" robbed you of "+fmt(l)+"!");tick()}});  
 r.on("shoot",m=>{const d=m.data||{},id=me();if(id&&d.to==id.peer&&S.go){const l=Math.min(S.cash,Math.max(0,Math.min(30000,Number(d.amt)||0)));S.cash-=l;S.en=10;S.log.unshift(String(d.n||"Someone").slice(0,20)+" shot you and took "+fmt(l)+". Get treated at the hospital.");tick()}});  
 r.on("pay",m=>{const d=m.data||{},id=me();if(id&&d.to==id.peer&&S.go&&!m.isMe){const amt=Math.min(5000000,Math.max(0,Math.floor(Number(d.amt)||0)));if(amt){S.cash+=amt;const fr=String(d.n||"Someone").slice(0,20);addFr(fr);S.log.unshift(fr+" sent you "+fmt(amt)+".");addF("Payment",fr+" sent you "+fmt(amt)+".",1);toast(fr+" sent you "+fmt(amt));tick()}}});  
 sync();draw()}
(async()=>{try{if(FBC||typeof claude=="undefined")return;const r=await claude.use("room");if(!r)return;wireRoom(r)}catch(e){}})();

<script>  
/* ===== Croc City animation layer v2 ===== */  
(function(){  
  const TW = new Map();  
  const BREATHERS = [];  
  let running = false;  const easeInOut = t => t<.5 ? 2tt : 1-Math.pow(-2*t+2,2)/2;
const easeOut  = t => 1-Math.pow(1-t,3);
const now = () => performance.now();

function tween(key,{from,to,dur,ease=easeInOut,onUpdate,onDone}){
TW.set(key,{from,to,dur,t0:now(),ease,onUpdate,onDone});
kick();
}
function cancel(key){ TW.delete(key); }
function kick(){ if(!running){ running=true; requestAnimationFrame(loop); } }

function loop(){
const t = now();
for(const [k,s] of TW){
const p = Math.min(1,(t-s.t0)/s.dur);
const e = s.ease(p);
const x = s.from + (s.to-s.from)e;
s.onUpdate(x,p);
if(p>=1){ TW.delete(k); if(s.onDone) s.onDone(); }
}
for(const b of BREATHERS){
if(!b.el.isConnected) continue;
const ph = (t/1000 + b.phase) % 3.5 / 3.5;
const s = 1 + Math.sin(phMath.PI2)0.012;
const ty = -Math.sin(phMath.PI2)*0.35;
b.el.setAttribute('transform',scale(1 ${s.toFixed(4)}) translate(0 ${ty.toFixed(3)}));
}
for(const w of WALKERS){
if(!w.el.isConnected) continue;
const dt = Math.min(48, t - (w.last||t)); w.last = t;
w.x += (dt/1000) * w.speed * w.dir;
if(w.dir>0 && w.x> w.max){ w.x = w.min; w.el.setAttribute('transform',translate(${w.min} ${w.y})); continue; }
if(w.dir<0 && w.x< w.min){ w.x = w.max; w.el.setAttribute('transform',translate(${w.max} ${w.y})); continue; }
const step = Math.sin((w.x/22) + w.phase);
const by = -Math.abs(step)w.amp;
const tilt = step2.2;
w.el.setAttribute('transform',translate(${w.x.toFixed(2)} ${w.y}) rotate(${tilt.toFixed(2)}) translate(0 ${by.toFixed(2)}));
}
if(TW.size || WALKERS.length){ requestAnimationFrame(loop); }
else { running = false; }
}

const playerPos = {x:45,y:172,f:1};
const SPEED = 70;

window.walkTo = function(pos,nx,ny,cb){
const d = Math.hypot(nx-pos.x, ny-pos.y);
const mv = document.getElementById('mv');
const fl = document.getElementById('fl');
if(!mv || !fl || d < 2){ if(cb) cb(); return; }
const wantDir = nx < pos.x ? -1 : 1;
if(wantDir !== pos.f){
cancel('turn');
tween('turn',{
from: fl._sx ?? (pos.f===-1?-1:1),
to: wantDir,
dur: 140,
ease: easeOut,
onUpdate: v => { fl._sx = v; fl.style.transform = scaleX(${v}); }
});
pos.f = wantDir;
}
const dur = Math.max(220, (d/SPEED)*1000);
cancel('walk');
const startX = pos.x, startY = pos.y;
const fg = mv.querySelector('.fg');
tween('walk',{
from: 0, to: 1, dur, ease: easeInOut,
onUpdate: p => {
const x = startX + (nx-startX)*p;
const y = startY + (ny-startY)p;
const step = Math.sin((dp)/14);
const by = -Math.abs(step)1.6;
const tilt = step2.5;
mv.setAttribute('transform',translate(${x.toFixed(2)} ${y.toFixed(2)}));
if(fg) fg.setAttribute('transform',rotate(${tilt.toFixed(2)}) translate(0 ${by.toFixed(2)}));
},
onDone: () => {
pos.x = nx; pos.y = ny;
if(fg) fg.setAttribute('transform','');
if(cb) cb();
}
});
};

const WALKERS = [];
window.walkers = function(n,y,sc){
const out = [];
for(let i=0;i<n;i++){
const id = w${Math.random().toString(36).slice(2,8)};
const phase = Math.random()Math.PI2;
const dir = i%2 ? -1 : 1;
const speed = 22 + Math.random()14;
const startX = dir>0 ? -40 + Math.random()60 : 400 - Math.random()60;
const figHtml = fig({s:(i2+1)%6,h:(i3)%5,t:(i5+2)%6},0,0,sc,'',0,dir);
out.push(<g class="walk" id="${id}" data-w="1" data-min="-40" data-max="400" data-y="${y}" data-dir="${dir}" data-speed="${speed}" data-amp="${1.4*sc}" data-phase="${phase}" transform="translate(${startX} ${y})">${figHtml.replace(/^<g [^>]*>/,'').replace(/<\/g>$/,'')}</g>);
}
requestAnimationFrame(()=>{
out.forEach(html=>{
const m = html.match(/id="(w[^"]+)"/);
if(!m) return;
const el = document.getElementById(m[1]);
if(!el) return;
const tr = el.getAttribute('transform')||'translate(0 0)';
const mm = tr.match(/translate(([-\d.]+)/);
WALKERS.push({
el,
x: mm ? parseFloat(mm[1]) : 0,
y: parseFloat(el.dataset.y),
dir: parseFloat(el.dataset.dir),
speed: parseFloat(el.dataset.speed),
amp: parseFloat(el.dataset.amp),
phase: parseFloat(el.dataset.phase),
min: parseFloat(el.dataset.min),
max: parseFloat(el.dataset.max),
last: 0
});
kick();
});
});
return out.join('');
};

window.breathe = function(){
requestAnimationFrame(()=>{
document.querySelectorAll('.fg').forEach(el=>{
if(el.dataset.breathing) return;
el.dataset.breathing = '1';
BREATHERS.push({ el, phase: Math.random()*3.5 });
});
kick();
});
};

const oldSpM = window.spM;
window.spM = function(e){
if(typeof SPX === 'undefined' || SPX == null){ if(oldSpM) oldSpM(e); return; }
const dx = e.clientX - SPX;
SPX = e.clientX;
SPIN += dx*0.02;
const c = Math.cos(SPIN);
const squash = 1 - Math.abs(c)0.03;
const stretch = 1 + Math.abs(c)0.02;
const g = document.getElementById('sg');
if(g) g.setAttribute('transform',translate(180 108) scale(${(c*squash).toFixed(4)} ${stretch.toFixed(4)}));
const sh = document.getElementById('spinSh');
if(sh){
sh.setAttribute('rx', (110 * (0.6 + 0.4Math.abs(c))).toFixed(1));
sh.setAttribute('opacity', (0.35 + 0.25Math.abs(c)).toFixed(2));
}
};
window.spU = function(){
if(typeof SPX !== 'undefined') SPX = null;
const face = Math.round(SPIN / Math.PI) * Math.PI;
tween('spinSettle',{
from: SPIN, to: face, dur: 260, ease: easeOut,
onUpdate: v => {
SPIN = v;
const c = Math.cos(v);
const g = document.getElementById('sg');
if(g) g.setAttribute('transform',translate(180 108) scale(${c.toFixed(4)} 1));
}
});
};

const oldDraw = window.draw;
if(typeof oldDraw === 'function'){
window.draw = function(){
oldDraw.apply(this, arguments);
requestAnimationFrame(()=>{
document.querySelectorAll('.av').forEach(g=>{
const t = (g.dataset.t||'0,0').split(',').map(Number);
const tr = g.getAttribute('transform')||'';
const m = tr.match(/translate(([-\d.]+)\s+([-\d.]+)/);
const cur = m ? {x:+m[1],y:+m[2]} : {x:t[0],y:t[1]};
const nx = t[0], ny = t[1];
if(Math.hypot(nx-cur.x, ny-cur.y) < 0.5) return;
const d = Math.hypot(nx-cur.x, ny-cur.y);
const dur = Math.max(300, d*22);
const key = 'av:'+g.dataset.t;
cancel(key);
tween(key,{
from: 0, to: 1, dur, ease: easeInOut,
onUpdate: p => {
const x = cur.x + (nx-cur.x)*p;
const y = cur.y + (ny-cur.y)p - Math.sin(pMath.PI)*6;
g.setAttribute('transform',translate(${x.toFixed(1)} ${y.toFixed(1)}));
}
});
});
});
};
}

setInterval(()=>{ if(document.querySelector('.fg')) breathe(); }, 1500);
})();
</script>
