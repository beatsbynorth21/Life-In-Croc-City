.tb2{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}
.tb2 button{border:1.5px solid var(--line);background:transparent;color:var(--ink);padding:7px 13px;border-radius:18px;font:600 14px inherit;font-family:inherit}
.tb2 button.on{background:var(--ink);color:var(--bg)}
.rob{border-color:var(--red)!important}
.av{transition:transform 1.6s linear}.wk{animation:bob .45s ease-in-out infinite}.wkr,.wkl{animation-timing-function:linear;animation-iteration-count:infinite}@keyframes wr{from{transform:translateX(-30px)}to{transform:translateX(390px)}}@keyframes wl{from{transform:translateX(390px)}to{transform:translateX(-30px)}}.wkr{animation-name:wr}.wkl{animation-name:wl}@keyframes bob{50%{transform:translateY(-2.5px)}}

.phone{--bg:#12163a;--ink:#efe6d2;--card:#1c2252;--ac:#7cc48a;--br:#e0b24a;--red:#e8876c;--mut:#b3b6d8;--line:#2c3470;position:relative;border:10px solid #0b0b0f;border-radius:46px;background:linear-gradient(#1c0c9a,#5b0b7d 55%,#8a0c0c);color:#efe6d2;min-height:560px;padding:12px 14px 80px;overflow:hidden}
.pn{width:120px;height:24px;background:#000;border-radius:14px;margin:0 auto -20px}
.ps{display:flex;justify-content:space-between;font-size:15px;font-weight:700;padding:2px 10px;position:relative;z-index:1}
.pg{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 6px;margin-top:22px;position:relative;z-index:1}
.ap{background:none;border:0;color:#efe6d2;font:inherit;font-size:12.5px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0}
.ic{width:62px;height:62px;border-radius:18px;display:grid;place-items:center;font-size:30px;border:1px solid #ffffff22}
.pa{position:relative;z-index:1;margin-top:20px}.pa h3{margin:6px 0 10px;font-size:20px}
.back{background:none;border:0;color:#efe6d2;font:600 15px inherit;font-family:inherit;padding:4px 0}
.pc{background:#3a3b42;color:#fff;border:0;border-radius:24px;padding:10px 20px;font:600 16px inherit;font-family:inherit}
.wz{--bg:#12163a;--ink:#efe6d2;--card:#1c2a3e;--ac:#1a8f4a;--br:#e0b24a;--red:#e8876c;--mut:#b3b6d8;--line:#2f3f57;background:#101c30;color:#efe6d2;border-radius:18px;padding:12px}

 if(k==H[S.hs].l)a.push({t:"Sleep at home",h:8,e:H[S.hs].e,f:-20,m:5+S.hs*4,c:0,x:"You rest well."});

 else if(i=="cars")CR.forEach((c,j)=>j>S.car&&a.push({t:"Buy "+c.n,h:1,c:-c.p,buy:["car",j],x:"You drive off the lot in a "+c.n+"."}));

 else if(i=="rob")a.push({t:"Rob a stranger",h:2,c:0,rob:1});else a.push(K[i])});return a}

 else if(!S.wel)h+=welcome();else if(!S.chd)h+=creator();else if(!S.go)h+=`<div class="place"><h2>Pick your start</h2><p>Choose how you enter Kaduna. You can change your name any time in the phone.</p><button class="act" onclick="begin(0)"><span>Lapo<small>${fmt(12000)}, a room in Ungwan Rimi, thrift wear. Grind your way up.</small></span></button><button class="act" onclick="begin(1)"><span>Nepo<small>${fmt(500000)}, a flat in Barnawa, a Corolla, a designer agbada.</small></span></button></div>`;
 else if(S.over||S.won)h+=`<div class="place"><h2>${S.won?"Dream achieved":"Evicted"}</h2><p>${S.won?DR[S.dr==null?1:S.dr].n+" in "+S.d+" days. Net worth "+fmt(nw())+".":"You lasted "+S.d+" days. Rent catches everyone."}</p><button class="act" onclick="reset()">Start again</button></div>`;
 else{const P=peers();
  h+=`<div class="pills"><span class="pill">${R?"● "+P.length+" online now":"Playing solo"}</span><span class="pill">${esc(H[S.hs].n)}</span><span class="pill">${S.car>=0?CR[S.car].n:"No car"}</span>${S.heat>0?`<span class="pill">Wanted ${S.heat}</span>`:""}</div><div class="bn">${WEEK[Math.floor(Date.now()/864e5)%WEEK.length]}</div><div class="tk" id="tk"></div><div class="stats">${bar("Energy",S.en)}${bar("Food",S.f)}${bar("Mood",S.m)}</div>`+tabsV()+view();
  const o=LOC[S.loc],here=P.filter(p=>!p.isMe&&p.presence.l==S.loc);
  h+=`<div class="place"><h2>${o.n}</h2><p>Tap a place on the map to travel.</p>${o.ad||BB.includes(S.loc)?`<div class="ad">KLAVE: the AI-powered beat marketplace</div>`:""}${acts(S.loc).map((a,i)=>{
   let w="";if(a.need&&S.sk<a.need)w="Needs skill "+a.need;else if(a.sw&&S.cl<a.sw)w="Dress code: needs better clothes";else if(a.e<0&&S.en<-a.e)w="Too tired";else if(a.f<0&&S.f<-a.f)w="Too hungry";else if(a.c<0&&S.cash<-a.c)w="Not enough cash";
   const p=a.rob?"50% risk":Array.isArray(a.c)?fmt(a.c[0])+" to "+fmt(a.c[1]):a.c?(a.c>0?"+":"")+fmt(a.c):"Free";

function buyCar(i){const c=CR[i];if(i<=S.car||S.cash<c.p)return;S.cash-=c.p;S.car=i;S.log.unshift("You buy a "+c.n+".");ev("bought a "+c.n);tick()}

function order(i){const o=MENU[i];if(S.cash<o.c)return;S.cash-=o.c;S.f=cl(S.f+o.f);S.m=cl(S.m+o.m);S.h+=1;S.log.unshift("A rider delivers "+o.n+".");tick()}
function gig(i){const g=GIG[i];if(S.en<-g.e||S.cash<(g.cost||0))return;S.en=cl(S.en+g.e);S.h+=g.h;if(g.mu){S.cash-=g.cost;S.mu=(S.mu||0)+g.mu*(has("music")?2:1);S.log.unshift("Studio session done. Music skill "+Math.floor(S.mu)+".")}else{const c=Math.round(rnd(g.c[0],g.c[1])*mult());S.cash+=c;S.log.unshift(g.n+": +"+fmt(c)+".")}tick()}
function clearRec(){if(S.cash<4000||!S.heat)return;S.cash-=4000;S.heat=0;S.log.unshift("Your record is cleared.");tick()}
function copyLink(){try{navigator.clipboard.writeText(LINK).then(()=>toast("Link copied","🔗")).catch(()=>toast("Copy it from the screen","🔗"))}catch(e){toast("Copy it from the screen","🔗")}}

function phone(){
 const P=peers(),top=[...P].sort((a,b)=>(b.presence.w||0)-(a.presence.w||0)).slice(0,5);

 if(TAB=="bank")b=`<div class="place"><h2>${fmt(S.cash)}</h2><p>Net worth ${fmt(nw())}${S.debt?". LAPO debt "+fmt(S.debt):""}. Weekly rent ${fmt(H[S.hs].r)}. Property income ${fmt(S.bd.reduce((a,n,i)=>a+n*BD[i].i,0))} per day.</p><p>Clothes: ${CH[S.cl].n}. Car: ${S.car>=0?CR[S.car].n:"none"}.</p></div>`+(R?`<div class="place" style="margin-top:10px"><h2>Send money</h2><p>Enter an amount (min ₦100), then tap a player who is online.</p><input inputmode="numeric" aria-label="Amount in naira" placeholder="Amount in naira" value="${PAYAMT}" oninput="PAYAMT=this.value.replace(/[^0-9]/g,'')" style="width:100%;padding:10px;margin:6px 0;border-radius:9px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit">${P.filter(p=>!p.isMe).map(p=>`<button class="act" onclick="sendMoney('${esc(p.peer)}')"><span>${esc(p.presence.n||"?")}<small>${esc(LOC[p.presence.l].n)}</small></span><b>Send</b></button>`).join("")||`<p class="lb">No other players online right now.</p>`}</div>`:`<p class="lb">Multiplayer is offline, so you cannot send money.</p>`);
 if(TAB=="houses")b=`<div class="place"><h2>Move house</h2><p>Deposit is two weeks of rent. You sleep at home.</p>${H.map((t,i)=>`<button class="act" ${i==S.hs||S.cash<t.r*2?"disabled":""} onclick="move(${i})"><span>${t.n}<small>Rent ${fmt(t.r)} per week${i==S.hs?" (current)":""}</small></span><b>${fmt(t.r*2)}</b></button>`).join("")}</div>`;
 if(TAB=="invest")b=`<div class="place"><h2>Invest in buildings</h2><p>Each building pays you every day.</p>${BD.map((t,i)=>`<button class="act" ${S.cash<t.p?"disabled":""} onclick="buyB(${i})"><span>${t.n} (own ${S.bd[i]})<small>+${fmt(t.i)} per day</small></span><b>${fmt(t.p)}</b></button>`).join("")}</div>`;
 if(TAB=="chat")b=`<div class="place"><h2>Chat</h2><input aria-label="Your name" maxlength="20" value="${esc(S.name)}" readonly style="width:100%;padding:10px;margin:6px 0;border-radius:9px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit"><div id="feed"></div><form onsubmit="say(event)"><input id="ci" maxlength="140" placeholder="Say something to everyone" autocomplete="off" style="width:100%;padding:10px;margin-top:6px;border-radius:9px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit"></form><p class="lb" style="margin-top:10px">${R?"Richest online:<br>"+top.map((p,i)=>`${i+1}. ${esc(p.presence.n||"?")}${p.isMe?" (you)":""}: ${fmt(p.presence.w||0)}`).join("<br>"):"Multiplayer is offline."}</p></div>`;
 if(TAB=="cars")b=`<div class="place"><h2>Cars</h2><p>${S.car>=0?"You drive a "+CR[S.car].n+".":"You have no car yet."} Cars cut fares and travel time.</p>${CR.map((c,i)=>`<button class="act" ${i<=S.car||S.cash<c.p?"disabled":""} onclick="buyCar(${i})"><span>${c.n}<small>${i==S.car?"Owned":i<S.car?"Outclassed":"Instant delivery"}</small></span><b>${fmt(c.p)}</b></button>`).join("")}</div>`;
 if(TAB=="boutique")b=`<div class="place"><h2>Boutique</h2><p>Better clothes lift your earnings and open club doors.</p>${CH.map((c,i)=>`<button class="act" ${i<=S.cl||S.cash<c.p?"disabled":""} onclick="buyCl(${i})"><span>${c.n}<small>${i==S.cl?"Wearing":i<S.cl?"Owned":"Dress code level "+i}</small></span><b>${c.p?fmt(c.p):"Free"}</b></button>`).join("")}</div><div class="place" style="margin-top:10px"><h2>Your look</h2>${charUI()}</div>`;
 if(TAB=="forbes"){const all=R?P.map(p=>({n:p.presence.n||"?",w:p.presence.w||0,me:p.isMe})):[{n:S.name,w:nw(),me:1}];all.sort((a,b)=>b.w-a.w);b=`<div class="place"><h2>Richest in Croc City</h2>${all.slice(0,10).map((p,i)=>`<p style="margin:6px 0;font-weight:${p.me?800:400}">${i+1}. ${esc(p.n)}${p.me?" (you)":""}: ${fmt(p.w)}</p>`).join("")}<p class="lb">Your net worth: ${fmt(nw())}</p></div>`}
 if(TAB=="health")b=`<div class="place"><h2>Health</h2><div class="stats">${bar("Energy",S.en)}${bar("Food",S.f)}${bar("Mood",S.m)}</div><button class="act" ${S.cash<3000?"disabled":""} onclick="medic()"><span>Buy medicine<small>+35 energy, +10 food, 1 hr</small></span><b>${fmt(3000)}</b></button></div>`;
 if(TAB=="ride"){const a=LOC[S.loc],L2=Object.entries(LOC).filter(([k])=>k!=S.loc).map(([k,o])=>{const d=Math.hypot(a.x-o.x,a.y-o.y)/100;return {k,n:o.n,d,f:S.car>=0?0:Math.round(100+d*150),h:Math.max(1,Math.ceil(d*1.3*(S.car>=0?.5:1)))}}).sort((x,y)=>x.d-y.d);b=`<div class="place"><h2>Ride</h2><p>You are at ${esc(a.n)}. Pick a destination.</p>${L2.map(o=>`<button class="act" onclick="ride('${o.k}')"><span>${esc(o.n)}<small>${o.h} hr</small></span><b>${o.f?fmt(o.f):"Free"}</b></button>`).join("")}</div>`}
 if(TAB=="food")b=`<div class="place"><h2>Chowdeck</h2><p>Food delivered wherever you are.</p>${MENU.map((o,i)=>`<button class="act" ${S.cash<o.c?"disabled":""} onclick="order(${i})"><span>${o.n}<small>+${o.f} food, 1 hr</small></span><b>${fmt(o.c)}</b></button>`).join("")}</div>`;
 if(TAB=="hustle")b=`<div class="place"><h2>Hustle</h2><p>Quick gigs you can do from anywhere.</p>${GIG.map((g,i)=>`<button class="act" ${S.en<-g.e||S.cash<(g.cost||0)?"disabled":""} onclick="gig(${i})"><span>${g.n}<small>${g.h} hr, ${g.e} energy</small></span><b>${g.c?fmt(g.c[0])+" to "+fmt(g.c[1]):"-"+fmt(g.cost)}</b></button>`).join("")}</div>`;
 if(TAB=="police")b=`<div class="place"><h2>Police</h2><p>Wanted level: <b>${S.heat||0}</b>. Higher levels make arrests more likely after a crime.</p><button class="act" ${S.cash<4000||!S.heat?"disabled":""} onclick="clearRec()"><span>Pay off your record<small>Reset wanted level to 0</small></span><b>${fmt(4000)}</b></button></div>`;
 if(TAB=="invite")b=`<div class="place"><h2>Invite friends</h2><p>Friends need to be signed in to claude.ai and have access to play together.</p><p style="word-break:break-all">${LINK}</p><button class="act" onclick="copyLink()"><span>Copy link</span></button></div>`;
 if(TAB=="set")b=`<div class="place"><h2>Settings</h2><p>Username: <b>${esc(S.name)}</b></p><button class="act rob" onclick="ph(0);reset()"><span>Restart game<small>Cannot be undone. Keeps your username and look.</small></span></button>${window.__signout?`<button class="act" onclick="__signout()"><span>Log out</span></button>`:""}</div>`;
 const home=TAB=="grid",ap=APPS.find(a=>a[0]==TAB),hr=S.h%12||12,tm=hr+":00 "+(S.h<12?"AM":"PM");
 document.getElementById("sh").innerHTML=`<div style="max-width:380px;margin:0 auto"><div style="text-align:right;margin-bottom:10px"><button class="pc" onclick="ph(0)">✕ Close</button></div><div class="phone"><div class="pn"></div><div class="ps"><b>${tm}</b><span>4G 🔋</span></div>${home?`<div style="position:relative;z-index:1;margin:16px 10px 0"><div style="font-size:60px;font-weight:800;line-height:1">${String(hr).padStart(2,"0")}:00</div><div style="color:#b3b6d8;margin-top:4px">${new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"})} · Kaduna</div></div><div class="pg">${APPS.map(a=>`<button class="ap" onclick="${a[4]?"toast('Coming soon','🚧')":"tab('"+a[0]+"')"}" style="${a[4]?"opacity:.45":""}"><span class="ic" style="background:${a[3]}">${a[2]}</span>${a[1]}</button>`).join("")}</div>`:`<div class="pa"><button class="back" onclick="tab('grid')">‹ Home</button><h3>${ap?ap[2]+" "+ap[1]:""}</h3>${b}</div>`}<svg viewBox="0 0 360 80" style="position:absolute;left:0;bottom:0;width:100%;opacity:.3;pointer-events:none"><path d="M0 80V50h20V35h25v25h18V20h22v40h20V40h25V55h18V30h22v50z" fill="#ffb4a0"/></svg></div></div>`;feed()}

draw();
(async()=>{try{if(typeof claude=="undefined")return;const r=await claude.use("room");if(!r)return;R=r;r.onPeers(()=>draw());
 r.on("chat",m=>{const d=m.data||{};addF(d.n||"?",d.t||"")});
